<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Küçük Bir Hediye 🌹</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* PEMBE + KIRMIZI ARKA PLAN */
    background: linear-gradient(135deg, #ff004c, #ff4d88, #ff99cc);

    font-family: Arial, sans-serif;
    overflow:hidden;
}

/* Buton */
button{
    padding:22px 45px;
    font-size:24px;
    border:none;
    border-radius:25px;
    background:white;
    color:#ff004c;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 30px rgba(0,0,0,0.35);
    transition:0.3s;
}

button:hover{
    transform:scale(1.12);
}

/* Uçan kalp + gül */
.item{
    position:absolute;
    font-size:26px;
    animation: float 6s linear infinite;
}

@keyframes float{
    from{transform:translateY(0); opacity:1;}
    to{transform:translateY(-110vh); opacity:0;}
}
</style>
</head>

<body>

<button onclick="ac()">Drewan Ağa Bas ❤️</button>

<script>
function ac(){
    document.body.innerHTML = `
    <h1 style="
        color:white;
        font-size:50px;
        text-align:center;
        padding:20px;
        text-shadow:0 0 15px rgba(0,0,0,0.4);">
        💖 Daima mutlu olun 💖<br><br>
        Drewan & İrem
    </h1>`;
}

/* Kalp + gül efekti */
setInterval(()=>{
    const item=document.createElement("div");
    item.className="item";

    const semboller=["❤️","🌹"];
    item.innerHTML=semboller[Math.floor(Math.random()*semboller.length)];

    item.style.left=Math.random()*100+"vw";
    item.style.top="100vh";

    document.body.appendChild(item);

    setTimeout(()=>item.remove(),6000);
},250);
</script>

</body>
</html>
